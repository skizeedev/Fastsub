{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='images/fastsub-logo.png') }}"
                        alt="FastSub"
                        width="80"
                        class="img-fluid">

                    <h2 class="mt-3">
                        Verify Your Email
                    </h2>

                    <p class="text-muted">
                        Your account has been created, but your email address has not been verified yet.
                    </p>

                </div>

                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ request.args.get('email', '') }}"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Resend Verification Email

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="{{ url_for('auth.login') }}">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
