{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='images/fastsub-logo.png') }}"
                        alt="FastSub"
                        width="80"
                        class="img-fluid">

                    <h2 class="mt-3">
                        Reset Password
                    </h2>

                    <p class="text-muted">
                        Create a new password for your FastSub account.
                    </p>

                </div>

                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">

                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                                minlength="6">

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword()">

                                👁

                            </button>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                name="confirm_password"
                                id="confirm_password"
                                class="form-control"
                                required
                                minlength="6">

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="toggleConfirmPassword()">

                                👁

                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        Update Password

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="{{ url_for('auth.login') }}">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    password.type =
        password.type === "password"
        ? "text"
        : "password";

}

function toggleConfirmPassword() {

    const password =
        document.getElementById("confirm_password");

    password.type =
        password.type === "password"
        ? "text"
        : "password";

}

</script>

{% endblock %}
