{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

        <div class="card shadow border-0">
            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='images/fastsub-logo.png') }}"
                        alt="FastSub"
                        width="80"
                        class="img-fluid">

                    <h2 class="mt-3">
                        Welcome Back
                    </h2>

                    <p class="text-muted">
                        Login to your FastSub account
                    </p>

                </div>

                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required>

                            <button
                                type="button"
                                class="btn btn-outline-secondary password-toggle"
                                onclick="togglePassword()"
                                aria-label="Show or hide password">

                               👁

                            </button>

                        </div>

                    </div>

                    <div class="text-end mb-3">

                        <a href="{{ url_for('auth.forgot_password') }}">
                            Forgot Password?
                        </a>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>

                <hr>

                <a
                    href="{{ url_for('auth.google_login') }}"
                    class="btn btn-danger w-100">

                    <i class="bi bi-google"></i>

                    Continue with Google

                </a>

                <div class="text-center mt-3">

                    <small>

                        Don't have an account?

                        <a href="{{ url_for('auth.register') }}">
                            Register
                        </a>

                    </small>

                </div>

            </div>
        </div>

    </div>
</div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

{% endblock %}
