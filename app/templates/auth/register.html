{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <img
                            src="{{ url_for('static', filename='images/fastsub-logo.png') }}"
                            alt="FastSub"
                            width="80">

                        <h2 class="mt-3">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join FastSub today
                        </p>

                    </div>

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}">


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    class="form-control"
                                    required
                                    onkeyup="checkStrength()">

                                <small id="strengthText"></small>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword()">

                                    👁

                                </button>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    name="confirm_password"
                                    id="confirm_password"
                                    class="form-control"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="toggleConfirmPassword()">

                                    👁

                                </button>

                            </div>

                        </div>
 
                        <div class="mb-3">

                            <label class="form-label">
                                Referral Code (Optional)
                            </label>

                            <input
                                type="text"
                                name="referred_by"
                                class="form-control"
                                placeholder="Enter referral code">

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Create Account

                        </button>

                    </form>

                    <hr>

                    <a
                        href="/google-login"
                        class="btn btn-danger w-100">

                        <i class="bi bi-google"></i>

                        Continue with Google

                    </a>

                    <div class="text-center mt-3">

                        <small>

                            Already have an account?

                            <a href="/login">
                                Login
                            </a>

                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<script>
function checkStrength() {

    let password =
        document.getElementById("password").value;

    let strength =
        document.getElementById("strengthText");

    if (password.length < 6) {

        strength.innerHTML = "❌ Weak Password";

    } else if (password.length < 10) {

        strength.innerHTML = "⚠️ Medium Password";

    } else {

        strength.innerHTML = "✅ Strong Password";

    }

}
</script>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

function toggleConfirmPassword() {

    const password =
        document.getElementById("confirm_password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

{% endblock %}
