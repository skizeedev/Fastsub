{% extends "base.html" %}

{% block content %}

<h2>Confirm Wallet Funding</h2>

<p><b>Amount:</b> ₦{{ amount }}</p>
<p><b>Reference:</b> {{ reference }}</p>

<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}">

    <button type="submit">
        Confirm Funding
    </button>
</form>

<a href="/fund-wallet">Cancel</a>

{% endblock %}
