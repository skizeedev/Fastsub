{% extends "base.html" %}

{% block content %}

<h2>Add Data Plan</h2>

<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}">


    <input
        type="text"
        name="network"
        placeholder="MTN"
        required
    >

    <input
        type="text"
        name="network_code"
        placeholder="01"
        required
    >

    <input
        type="text"
        name="plan_code"
        required
    >

    <input
        type="text"
        name="plan_name"
        required
    >

    <input
        type="number"
        step="0.01"
        name="cost_price"
        required
    >

    <input
        type="number"
        step="0.01"
        name="selling_price"
        required
    >

    <button type="submit">
        Save
    </button>

</form>

{% endblock %}
