{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4 class="mb-0">

📢 Create Announcement

</h4>

</div>

<div class="card-body">

<form method="POST">

<input
type="hidden"
name="csrf_token"
value="{{ csrf_token() }}">

<div class="mb-3">

<label>

Title

</label>

<input
type="text"
name="title"
class="form-control"
value="{{ announcement.title }}">

</div>

<div class="mb-3">

<label>

Announcement Type

</label>

<select
name="announcement_type"
class="form-select">

<option value="info">

Information

</option>

<option value="success">

Success

</option>

<option value="promotion">

Promotion

</option>

<option value="warning">

Warning

</option>

<option value="danger">

Danger

</option>

</select>

</div>

<div class="mb-3">

<label>

Priority

</label>

<select
name="priority"
class="form-select">

<option value="low">

Low

</option>

<option value="normal"
selected>

Normal

</option>

<option value="important">

Important

</option>

<option value="critical">

Critical

</option>

</select>

</div>

<div class="mb-3">

<label>

Message

</label>

<textarea
name="message"
rows="6"
class="form-control">{{ announcement.message }}</textarea>

</textarea>

</div>

<div class="row">

<div class="col-md-6">

<label>

Start Date

</label>

<input
type="datetime-local"
name="start_date"
class="form-control">

</div>

<div class="col-md-6">

<label>

Expiry Date

</label>

<input
type="datetime-local"
name="expiry_date"
class="form-control">

</div>

</div>

<hr>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="active"

{% if announcement.active %}

checked

{% endif %}>

<label>

Active

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="active"

{% if announcement.active %}

pinned

{% endif %}>

<label>

Pin Announcement

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="active"

{% if announcement.active %}

popup

{% endif %}>

<label>

Show Login Popup

</label>

</div>

<hr>

<button
class="btn btn-success">

Publish Announcement

</button>

<a
href="{{ url_for('admin.admin_announcements') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
